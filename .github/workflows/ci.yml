# Every push/PR: lint and run the full test suite (incl. publisher tests
# against a replica of BidFlow's job_feed schema). On main, if tests pass,
# publish the jobfetch-backend image to GitHub's container registry:
#   ghcr.io/aidencayfordwork/job_fetching_service:latest   (newest main)
#   ghcr.io/aidencayfordwork/job_fetching_service:sha-<commit>  (pin / roll back)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobfetch
          POSTGRES_PASSWORD: jobfetch
          POSTGRES_DB: jobfetch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobfetch -d jobfetch"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://jobfetch:jobfetch@localhost:5432/jobfetch
      DATABASE_SCHEMA: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Load the BidFlow job_feed replica
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U jobfetch -d jobfetch -c "CREATE DATABASE bidflow_replica"
          docker exec -i ${{ job.services.postgres.id }} psql -U jobfetch -d bidflow_replica -v ON_ERROR_STOP=1 -q < docs/bidflow/job_feed_schema.sql
      - run: alembic upgrade head
      - run: python -m app.db.seed
      - run: ruff check app/ tests/ alembic/ --select F,E9
      - run: pytest -q

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aidencayfordwork/job_fetching_service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
