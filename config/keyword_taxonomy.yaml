# Curated keyword taxonomy for senior software engineering roles.
#
# This is a CONTROLLED vocabulary, not a source for free-form NLP keyword
# extraction. app/pipeline/match_keywords.py matches job title + cleaned JD
# text against this list and stores which canonical terms were found in
# jobs.matched_keywords. The downstream Job Application Service uses that
# fixed vocabulary to compute a profile-match score (set overlap between a
# candidate's own keyword list and a job's matched_keywords) — so every term
# here should be something a candidate could plausibly list as a skill/
# interest on their own profile.
#
# Format: canonical_name: [alias1, alias2, ...]
# Aliases are matched case-insensitively as whole words/phrases, except
# terms flagged under `case_sensitive_terms` below (short tokens like "Go",
# "R", "C" are ambiguous against normal English and are matched case-
# sensitively, exact token only, to cut false positives.

