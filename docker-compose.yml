name: job-fetching-service

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobfetch
      POSTGRES_PASSWORD: jobfetch
      POSTGRES_DB: jobfetch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfetch -d jobfetch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
